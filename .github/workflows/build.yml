name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Grafel-windows
            # icon/data flags come from Grafel.spec on Windows (spec-file build)
          - os: macos-latest
            artifact: Grafel-macos
            icon: --add-data "assets/grafel.png:."
          - os: ubuntu-latest
            artifact: Grafel-linux
            icon: --add-data "assets/grafel.png:."
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pystray graphifyy==0.9.81

      - name: Generate icon
        run: python assets/make_icon.py

      # Windows builds from Grafel.spec (same as build.bat) so BOTH exes are
      # produced: Grafel.exe (windowed GUI) and GrafelCLI.exe (console
      # companion required by installer.iss [Files] and the grafel-*.cmd
      # shims). A plain --onefile --windowed CLI invocation only yields
      # Grafel.exe, which makes the installer job's iscc step fail.
      - name: Build (PyInstaller, Grafel.spec)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean Grafel.spec

      - name: Build (PyInstaller)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name Grafel ${{ matrix.icon }} \
            --collect-all graphify --collect-all pystray \
            grafel.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # Windows-only: also compile the one-click installer
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate icon
        run: |
          pip install pillow
          python assets/make_icon.py
      - uses: actions/download-artifact@v4
        with:
          name: Grafel-windows
          path: dist
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Compile installer
        run: iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GrafelSetup-windows
          path: installer/*.exe
